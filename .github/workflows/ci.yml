name: SilverShield CI & AgentOps Regression Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: Lint, Typecheck, Unit Tests & Golden Eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff lint
        run: uv run ruff check app tests

      - name: Run Mypy typecheck
        run: uv run mypy app

      - name: Run Pytest unit & orchestration suite
        run: uv run pytest -m "not integration" --cov=app --cov-report=term-missing -v

      - name: Run Golden Dataset Regression Evaluation (offline harness)
        run: uv run python tests/eval/run_golden_eval.py

  terraform-validate:
    name: Validate Terraform IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform Format Check
        run: terraform -chdir=deployment/terraform fmt -check -recursive

      - name: Terraform Init (no backend)
        run: terraform -chdir=deployment/terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=deployment/terraform validate

  secret-hygiene:
    name: Verify Zero Hardcoded Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository for leaked API keys or private keys
        run: |
          if grep -RInE "(AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY)" app deployment tests; then
            echo "ERROR: Potential hardcoded secret detected!"
            exit 1
          fi
          echo "Secret hygiene scan passed."
