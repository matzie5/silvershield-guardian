[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "silvershield-guardian"
version = "1.0.0"
description = "Agents for Good: Multi-agent ADK guardian protecting senior citizens from scams and fake news."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.14"
authors = [{ name = "SilverShield Maintainers" }]
keywords = [
  "google-adk",
  "agentops",
  "scam-detection",
  "fake-news-detection",
  "senior-safety",
  "agents-for-good",
]
dependencies = [
  "google-adk>=1.18.0",
  "google-genai>=1.10.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "aiosqlite>=0.20.0",
  "structlog>=24.4.0",
  "opentelemetry-api>=1.28.0",
  "opentelemetry-sdk>=1.28.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.32.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-secret-manager>=2.21.0",
  "google-cloud-dlp>=3.25.0",
  "google-cloud-modelarmor>=0.3.0",
  "google-cloud-aiplatform>=1.80.0",
  "google-cloud-logging>=3.11.0",
  "opentelemetry-exporter-gcp-trace>=1.8.0",
  "opentelemetry-exporter-otlp>=1.28.0",
  "asyncpg>=0.30.0",
]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agents-cli]
name = "silvershield-guardian"
agent_directory = "app"
template = "adk"
deployment_target = "cloud_run"
session_type = "cloud_sql"
cicd_runner = "github_actions"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "integration: live model or external integration tests",
  "eval: evaluation suite tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/"]
